[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chem-agent"
version = "2.1.0"
description = "A professional AI agent for chemical analysis and informatics."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Your Name", email = "your.email@example.com" }
]
dependencies = [
    "openai",
    "rdkit",
    "streamlit",
    "pypdf",
    "python-dotenv",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-mock",
]

[project.scripts]
chem-agent = "src.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
